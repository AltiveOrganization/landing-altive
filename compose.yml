services:
  dev:
    build:
      context: .
      target: development
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    init: true

  prod:
    build:
      context: .
      target: production
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  node_modules:
